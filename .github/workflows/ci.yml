# Build the studio and run its tests.
#
# Windows on the MSYS2 UCRT64 toolchain a local build uses: the platform the
# installers are built for, where pacman has everything the studio needs -- Qt
# 6, Qwt built against it, Armadillo, OpenBLAS and HDF5. Linux on Ubuntu 26.04,
# whose apt has Qt 6.10 (24.04's stops at 6.4, below the 6.5 the studio asks
# for); no distribution packages Qwt for Qt 6, so that job builds it,
# .github/scripts/build-qwt.sh, and caches the result.
#
# BayesTS comes in through FetchContent at the tag CMakeLists.txt pins
# (STUDIO_BAYESTS_GIT_TAG), so this builds the sampler code a release ships.
# Two tests stay unregistered here, as on any clone: structural.bvartools_reference
# and horserace.end_to_end read test/reference, which bvartools generates and
# which is not checked in. workflow.assistant skips the paper examples without
# STUDIO_REPRODUCTIONS.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: windows / msys2 ucrt64 / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}

    env:
      # Draws are reproducible from a seed only single-threaded; the tests that
      # estimate set these themselves, and this covers the rest.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v7

      # gcc-fortran named explicitly, as BayesTS's CI does: BayesTS's project()
      # declares Fortran, and the toolchain group alone has left a job without
      # gfortran before.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
          pacboy: >-
            toolchain:p
            gcc-fortran:p
            cmake:p
            ninja:p
            armadillo:p
            hdf5:p
            openblas:p
            qt6-base:p
            qt6-svg:p
            qwt-qt6:p

      - name: Verify the toolchain
        run: |
          for tool in gcc g++ gfortran cmake ninja; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not on PATH"; exit 1; }
            printf '%-9s %s\n' "$tool" "$($tool --version | head -1)"
          done
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qwt-qt6

      # HighFive is header-only and not in pacman. BayesTS pins the version it
      # is built against in .github/highfive-version, so read that file at the
      # tag this build fetches rather than repeating the pin here.
      - name: Fetch HighFive
        run: |
          tag=$(sed -n 's/^set(STUDIO_BAYESTS_GIT_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt)
          test -n "$tag" || { echo "::error::no STUDIO_BAYESTS_GIT_TAG in CMakeLists.txt"; exit 1; }
          ref=$(curl -fsSL "https://raw.githubusercontent.com/franzmohr/BayesTS/$tag/.github/highfive-version" | tr -d '[:space:]')
          echo "BayesTS $tag, HighFive $ref"
          git clone --depth 1 --branch "$ref" \
            https://github.com/BlueBrain/HighFive.git "$RUNNER_TEMP/highfive"
          test -f "$RUNNER_TEMP/highfive/include/highfive/H5File.hpp"

      # Without a preset: the committed ones carry no paths, which live in the
      # gitignored CMakeUserPresets.json. nvpl is BayesTS's optional NVIDIA
      # BLAS, which the runner does not have.
      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHIGHFIVE_DIR="$RUNNER_TEMP/highfive" \
            -DCMAKE_DISABLE_FIND_PACKAGE_nvpl=TRUE

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  linux:
    name: ubuntu 26.04 / ${{ matrix.build_type }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      # The UI tests open every dialog; the runner has no display.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qmake6 qt6-svg-dev libgl-dev \
            libarmadillo-dev libopenblas-dev libhdf5-dev

      # Keyed on the script, which pins Qwt's version and checksum, and on the
      # runner image, whose Qt it is built against.
      - name: Cache Qwt
        id: qwt
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/qwt
          key: qwt-${{ runner.os }}-${{ hashFiles('.github/scripts/build-qwt.sh') }}-${{ env.ImageVersion }}

      - name: Build Qwt
        if: steps.qwt.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-qwt.sh "$RUNNER_TEMP/qwt"

      - name: Fetch HighFive
        run: |
          tag=$(sed -n 's/^set(STUDIO_BAYESTS_GIT_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt)
          test -n "$tag" || { echo "::error::no STUDIO_BAYESTS_GIT_TAG in CMakeLists.txt"; exit 1; }
          ref=$(curl -fsSL "https://raw.githubusercontent.com/franzmohr/BayesTS/$tag/.github/highfive-version" | tr -d '[:space:]')
          echo "BayesTS $tag, HighFive $ref"
          git clone --depth 1 --branch "$ref" \
            https://github.com/BlueBrain/HighFive.git "$RUNNER_TEMP/highfive"

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHIGHFIVE_DIR="$RUNNER_TEMP/highfive" \
            -DQwt_ROOT="$RUNNER_TEMP/qwt" \
            -DCMAKE_DISABLE_FIND_PACKAGE_nvpl=TRUE

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
